<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D0F14" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CryptoBot" />
    <title>Crypto Market Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base">
    <script>
      // Тема застосовується ДО першого рендера React — з двох причин:
      //   1) немає спалаху чужої теми при завантаженні;
      //   2) компоненти, що читають CSS-змінні на монтуванні (графік),
      //      бачать уже правильні кольори. Ефекти дітей у React біжать
      //      раніше за ефекти батьків, тож ThemeProvider не встигав.
      (function () {
        try {
          var saved = localStorage.getItem("cmb_theme");
          var mode = saved === "dark" || saved === "light" ? saved : "system";
          var light =
            mode === "light" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("light", light);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", light ? "#F6F7FB" : "#0D0F14");
        } catch (e) {
          /* приватний режим може заборонити localStorage — лишається темна */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
